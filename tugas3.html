<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuat Kalkulator</title>
    <link rel="stylesheet" href="form.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #d8b4fe, #fbcfe8);
            display: flex;
            justify-content: center;
            align-items: center;
            height:100vh;
        
        }

        .kalkulator {
            background-color: white;
            width: 350px;
            padding: 30px;
            border-radius: 20px;
          
            text-align: center;
        }

        h2 {
            color: #f586e4;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 16px;
            outline: none;
        }

     
        

        .tombol {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px 0 25px;
        }

        button {
            width: 55px;
            height: 45px;
            border: none;
            border-radius: 10px;
            background-color: #f088e9;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

       

        .hasil {
            background-color: #f3e8ff;
            border-color: #c084fc;
            font-weight: bold;
            color: #f48ce4;
        }

      
    </style>
</head>

<body>

    <div class="kalkulator">

        <h2> Kalkulator Aritmatika </h2>

        <label for="Input Bilangan">Input Bilangan 1</label>
        <input type="number" id="bilangan1" name="input bilangan 1" placeholder="Masukkan angka pertama">
        <label for="Input Bilangan">Input Bilangan 2</label>
        <input type="number" id="bilangan2" name="input bilangan 2" placeholder="Masukkan angka kedua">

        <div class="tombol">
            <button onclick="hitung('+')">+</button>
            <button onclick="hitung('-')">-</button>
            <button onclick="hitung('*')">x</button>
            <button onclick="hitung('/')">÷</button>
        </div>

        <label>Output</label>
        <input type="text" id="output" class="hasil"  placeholder="Hasil">

      

    </div>


    <script>
        function hitung(operator) {

            let bilangan1 = Number(
                document.getElementById("bilangan1").value
            );

            let bilangan2 = Number(
                document.getElementById("bilangan2").value
            );

            let hasil;

            if (operator == "+") {
                hasil = bilangan1 + bilangan2;
            }

            else if (operator == "-") {
                hasil = bilangan1 - bilangan2;
            }

            else if (operator == "*") {
                hasil = bilangan1 * bilangan2;
            }

            else if (operator == "/") {

                if (bilangan2 == 0) {
                    hasil = "Tidak bisa dibagi 0";
                }

                else {
                    hasil = bilangan1 / bilangan2;
                }
            }

            document.getElementById("output").value = hasil;
        }
    </script>

</body>
</html>
